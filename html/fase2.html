<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo de Reciclagem - Fase 2</title>
    <link rel="stylesheet" href="../css/fase2.css" />
    <link
      rel="shortcut icon"
      href="png-transparent-recycling-symbol-paper-greening-environment-miscellaneous-angle-leaf.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <div id="game-container">
      <div id="score-board">
        <p>Pontuação: <span id="score">0</span></p>
      </div>

      <div id="bin-container">
        <div class="bin" data-type="paper">
          <img src="../lixeiras/lixeira2.png" alt="Lixeira Papel" />
        </div>
        <div class="bin" data-type="glass">
          <img src="../lixeiras/lixeira5.png" alt="Lixeira Vidro" />
        </div>
        <div class="bin" data-type="organic">
          <img src="../lixeiras/lixeira4.png" alt="Lixeira Orgânico" />
        </div>
        <div class="bin" data-type="plastic">
          <img src="../lixeiras/lixeira3.png" alt="Lixeira Plástico" />
        </div>
        <div class="bin" data-type="metal">
          <img src="../lixeiras/lixeira1.png" alt="Lixeira Metal" />
        </div>
      </div>

      <div id="trash-container">
        <!-- Lixos serão inseridos aqui dinamicamente -->
      </div>

      <!-- Modal Resultado -->
      <div id="resultadoModal" class="modal">
        <div class="modal-content">
          <h2>Fim da Fase</h2>
          <p>Sua pontuação foi: <span id="finalScore"></span></p>
          <button id="restartGame">Reiniciar Fase</button>
          <button id="nextPhase">Próxima Fase</button>
          <button id="goToPhaseScreen">Voltar à Tela de Fases</button>
        </div>
      </div>

      <button
        id="toggle-music"
        class="music-button"
        style="position: absolute; top: 20px; left: 10px"
      >
        🔊
      </button>
    </div>

    <!-- Sons dos lixos e música de fundo -->
    <audio id="metal-sound" src="metal.mp3"></audio>
    <audio id="plastic-sound" src="plastic.mp3"></audio>
    <audio id="paper-sound" src="paper.mp3"></audio>
    <audio id="glass-sound" src="glassFLAC.mp3"></audio>
    <audio id="organic-sound" src="organic.mp3"></audio>
    <audio
      id="background-sound"
      src="../sons/After_School_Jamboree.mp3"
      loop
    ></audio>

    <audio id="error-sound" src="misplaced.mp3"></audio>

    <!-- Script JavaScript -->
    <script src="../js/fase2.js"></script>
  </body>
</html>
